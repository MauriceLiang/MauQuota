name: Build & Release

on:
  push:
    branches: [main, "preview/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_CLI_VERSION: "0.169.0"

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run tests
        run: swift test

  build:
    name: Build (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release binary
        run: swift build --configuration release --product MauQuota

      - name: Fetch official Codex runtime
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              NPM_PLATFORM="darwin-arm64"
              TARGET_TRIPLE="aarch64-apple-darwin"
              ;;
            x86_64)
              NPM_PLATFORM="darwin-x64"
              TARGET_TRIPLE="x86_64-apple-darwin"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          RUNTIME_DIR="$RUNNER_TEMP/codex-runtime"
          mkdir -p "$RUNTIME_DIR"
          npm pack "@openai/codex@$CODEX_CLI_VERSION-$NPM_PLATFORM" --pack-destination "$RUNTIME_DIR"
          ARCHIVE="$(find "$RUNTIME_DIR" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$RUNTIME_DIR"

          PACKAGE_ROOT="$RUNTIME_DIR/package"
          CODEX_BINARY="$(find "$PACKAGE_ROOT/vendor/$TARGET_TRIPLE" -type f -name codex -print -quit)"
          if [ -z "$CODEX_BINARY" ]; then
            echo "Could not find the official Codex binary for $TARGET_TRIPLE" >&2
            find "$PACKAGE_ROOT/vendor" -maxdepth 5 -type f -print >&2 || true
            exit 1
          fi
          CODEX_LICENSE="$PACKAGE_ROOT/LICENSE"
          test -s "$CODEX_LICENSE"
          chmod 755 "$CODEX_BINARY"
          "$CODEX_BINARY" --version
          "$CODEX_BINARY" app-server --help >/dev/null

          echo "CODEX_BINARY=$CODEX_BINARY" >> "$GITHUB_ENV"
          echo "CODEX_LICENSE=$CODEX_LICENSE" >> "$GITHUB_ENV"

      - name: Assemble and sign app bundle
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MauQuota.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Helpers"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp .build/release/MauQuota "$APP/Contents/MacOS/MauQuota"
          cp "$CODEX_BINARY" "$APP/Contents/Helpers/codex"
          cp "$CODEX_LICENSE" "$APP/Contents/Resources/Codex-LICENSE.txt"
          chmod 755 "$APP/Contents/MacOS/MauQuota" "$APP/Contents/Helpers/codex"
          codesign --force --sign - --timestamp=none "$APP/Contents/Helpers/codex"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify binary architecture
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          for BINARY in "$RUNNER_TEMP/MauQuota.app/Contents/MacOS/MauQuota" "$RUNNER_TEMP/MauQuota.app/Contents/Helpers/codex"; do
            BINARY_ARCHS="$(lipo -archs "$BINARY")"
            case " $BINARY_ARCHS " in
              *" $HOST_ARCH "*) ;;
              *) echo "Architecture mismatch: host=$HOST_ARCH binary=$BINARY_ARCHS path=$BINARY" >&2; exit 1 ;;
            esac
          done

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ARCH="$(uname -m)"
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING" dist
          ditto "$RUNNER_TEMP/MauQuota.app" "$STAGING/MauQuota.app"
          ln -s /Applications "$STAGING/Applications"
          DMG="dist/MauQuota-${VERSION}-macos-${ARCH}.dmg"
          hdiutil create -quiet -volname "MauQuota ${VERSION}" \
            -srcfolder "$STAGING" -format UDZO -imagekey zlib-level=9 -ov "$DMG"
          hdiutil verify "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: MauQuota-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/preview/')
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches Info.plist
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v$VERSION"
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match Info.plist version $VERSION" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download DMGs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && shasum -a 256 *.dmg > SHA256SUMS)
          if [[ "$GITHUB_REF" == refs/heads/preview/* ]]; then
            gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS \
              --target "$GITHUB_SHA" --title "MauQuota $RELEASE_TAG (Preview)" \
              --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS \
              --title "MauQuota $RELEASE_TAG" --generate-notes
          fi
