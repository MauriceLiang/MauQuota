name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*", "!*-preview.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[cleanup-only]') }}
    name: Test
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run tests
        run: swift test

  build:
    name: Build (${{ matrix.arch }})
    # For the one-time 2.0.0 promotion, reuse the verified arm64 artifact from PR run #63.
    # The PR and main commits have identical Git trees. Future releases build both architectures.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish MauQuota 2.0.0')) && '[{"runner":"macos-15-intel","arch":"x86_64"}]' || '[{"runner":"macos-15","arch":"arm64"},{"runner":"macos-15-intel","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release binary
        run: swift build --configuration release --product MauQuota

      - name: Assemble and sign app bundle
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MauQuota.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp .build/release/MauQuota "$APP/Contents/MacOS/MauQuota"
          chmod 755 "$APP/Contents/MacOS/MauQuota"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify binary architecture
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          BINARY="$RUNNER_TEMP/MauQuota.app/Contents/MacOS/MauQuota"
          BINARY_ARCHS="$(lipo -archs "$BINARY")"
          case " $BINARY_ARCHS " in
            *" $HOST_ARCH "*) ;;
            *) echo "Architecture mismatch: host=$HOST_ARCH binary=$BINARY_ARCHS path=$BINARY" >&2; exit 1 ;;
          esac

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ARCH="$(uname -m)"
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING" dist
          ditto "$RUNNER_TEMP/MauQuota.app" "$STAGING/MauQuota.app"
          ln -s /Applications "$STAGING/Applications"
          DMG="dist/MauQuota-${VERSION}-macos-${ARCH}.dmg"
          hdiutil create -quiet -volname "MauQuota ${VERSION}" \
            -srcfolder "$STAGING" -format UDZO -imagekey zlib-level=9 -ov "$DMG"
          hdiutil verify "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: MauQuota-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview.')) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish MauQuota 2.0.0'))
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine release tag and verify version
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v$VERSION"
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$TAG_VERSION" == *-preview.* ]]; then
            TAG_VERSION="${TAG_VERSION%%-preview.*}"
          fi
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match Info.plist version $VERSION" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download DMGs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Download previously validated Apple Silicon DMG for 2.0.0
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish MauQuota 2.0.0')
        uses: actions/download-artifact@v8
        with:
          name: MauQuota-macos-arm64
          path: artifacts
          run-id: 43882752857
          github-token: ${{ github.token }}

      - name: Verify both release installers
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test -s "artifacts/MauQuota-${VERSION}-macos-arm64.dmg"
          test -s "artifacts/MauQuota-${VERSION}-macos-x86_64.dmg"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && shasum -a 256 *.dmg > SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skip duplicate creation."
          else
            NOTES_FILE=".github/release-notes/${RELEASE_TAG}.md"
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS \
                --target "$GITHUB_SHA" --title "MauQuota $RELEASE_TAG" --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS \
                --target "$GITHUB_SHA" --title "MauQuota $RELEASE_TAG" --generate-notes
            fi
          fi

      - name: Clean up superseded preview releases and branches
        if: (github.ref == 'refs/tags/v2.0.0') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish MauQuota 2.0.0'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FAILED=0

          PREVIEW_TAGS="$(gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true and (.tagName | contains("-preview."))) | .tagName')"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Removing preview release and tag: $tag"
            if ! gh release delete "$tag" --cleanup-tag --yes; then
              echo "Failed to remove preview release: $tag" >&2
              FAILED=1
            fi
          done <<< "$PREVIEW_TAGS"

          OBSOLETE_BRANCHES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name | select(startswith("preview/") or . == "release/enable-v1.9.0-main-publish" or . == "feature/native-oauth-direct-api" or . == "perf/reduce-memory-footprint")')"
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            echo "Removing obsolete branch: $branch"
            if ! gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"; then
              echo "Failed to remove obsolete branch: $branch" >&2
              FAILED=1
            fi
          done <<< "$OBSOLETE_BRANCHES"

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more preview artifacts could not be removed." >&2
            exit 1
          fi
          echo "Preview releases, tags, and branches have been cleaned up."
