name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run tests
        run: swift test

  build:
    name: Build (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release binary
        run: swift build --configuration release --product MauQuota

      - name: Assemble and sign app bundle
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MauQuota.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp .build/release/MauQuota "$APP/Contents/MacOS/MauQuota"
          chmod 755 "$APP/Contents/MacOS/MauQuota"
          codesign --force --sign - "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: Verify binary architecture
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          BINARY_ARCHS="$(lipo -archs "$RUNNER_TEMP/MauQuota.app/Contents/MacOS/MauQuota")"
          case " $BINARY_ARCHS " in
            *" $HOST_ARCH "*) ;;
            *) echo "Architecture mismatch: host=$HOST_ARCH binary=$BINARY_ARCHS" >&2; exit 1 ;;
          esac

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ARCH="$(uname -m)"
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING" dist
          ditto "$RUNNER_TEMP/MauQuota.app" "$STAGING/MauQuota.app"
          ln -s /Applications "$STAGING/Applications"
          DMG="dist/MauQuota-${VERSION}-macos-${ARCH}.dmg"
          hdiutil create -quiet -volname "MauQuota ${VERSION}" \
            -srcfolder "$STAGING" -format UDZO -imagekey zlib-level=9 -ov "$DMG"
          hdiutil verify "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: MauQuota-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches Info.plist
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Info.plist version ${VERSION}" >&2
            exit 1
          fi

      - name: Download DMGs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && shasum -a 256 *.dmg > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" artifacts/*.dmg artifacts/SHA256SUMS \
            --title "MauQuota $GITHUB_REF_NAME" --generate-notes
