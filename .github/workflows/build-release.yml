name: Build & Release

on:
  push:
    branches: [main, "preview/**"]
    tags: ["v*", "!*-preview.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CODEX_APP_SERVER_VERSION: "0.169.0"

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run tests
        run: swift test

  build:
    name: Build (${{ matrix.arch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release binary
        run: swift build --configuration release --product MauQuota

      - name: Fetch official Codex App Server runtime
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64)
              TARGET_TRIPLE="aarch64-apple-darwin"
              EXPECTED_SHA256="86270c0473858bc5a43f139fc1c105b90b4850c4b779103aced907d1ab19e1e4"
              ;;
            x86_64)
              TARGET_TRIPLE="x86_64-apple-darwin"
              EXPECTED_SHA256="da47277adaf73960a6af1898d35121a230821fd0cd4f3839fb17f21b25e7044e"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          RUNTIME_DIR="$RUNNER_TEMP/codex-app-server"
          EXTRACT_DIR="$RUNTIME_DIR/extracted"
          mkdir -p "$EXTRACT_DIR"
          ASSET="codex-app-server-$TARGET_TRIPLE.tar.gz"
          curl -fsSL "https://github.com/openai/codex/releases/download/rust-v$CODEX_APP_SERVER_VERSION/$ASSET" -o "$RUNTIME_DIR/$ASSET"
          echo "$EXPECTED_SHA256  $RUNTIME_DIR/$ASSET" | shasum -a 256 -c -
          tar -xzf "$RUNTIME_DIR/$ASSET" -C "$EXTRACT_DIR"

          # The upstream archive names the executable after its target triple.
          APP_SERVER_BINARY="$(find "$EXTRACT_DIR" -type f -print -quit)"
          if [ -z "$APP_SERVER_BINARY" ]; then
            echo "Could not find an executable in the official App Server release archive" >&2
            find "$EXTRACT_DIR" -maxdepth 4 -ls >&2 || true
            exit 1
          fi
          file "$APP_SERVER_BINARY"
          CODEX_LICENSE="$RUNTIME_DIR/Codex-LICENSE.txt"
          curl -fsSL "https://raw.githubusercontent.com/openai/codex/rust-v$CODEX_APP_SERVER_VERSION/LICENSE" -o "$CODEX_LICENSE"
          test -s "$CODEX_LICENSE"
          chmod 755 "$APP_SERVER_BINARY"
          "$APP_SERVER_BINARY" --version
          "$APP_SERVER_BINARY" --help >/dev/null

          python3 - "$APP_SERVER_BINARY" <<'PY'
          import json
          import select
          import subprocess
          import sys
          from urllib.parse import urlparse

          process = subprocess.Popen(
              [sys.argv[1], "--listen", "stdio://"],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
              text=True,
              bufsize=1,
          )

          def send(message):
              process.stdin.write(json.dumps(message) + "\n")
              process.stdin.flush()

          def receive(request_id):
              while True:
                  ready, _, _ = select.select([process.stdout], [], [], 20)
                  if not ready:
                      raise TimeoutError(f"Codex App Server timed out waiting for response {request_id}")
                  line = process.stdout.readline()
                  if not line:
                      raise RuntimeError("Codex App Server closed stdout unexpectedly")
                  message = json.loads(line)
                  if message.get("id") == request_id:
                      if "error" in message:
                          raise RuntimeError(f"Codex App Server RPC failed: {message['error']}")
                      return message.get("result", {})

          try:
              send({
                  "id": 1,
                  "method": "initialize",
                  "params": {
                      "clientInfo": {
                          "name": "mauquota_macos",
                          "title": "MauQuota",
                          "version": "1.8.6-preview.3",
                      },
                      "capabilities": {},
                  },
              })
              receive(1)
              send({"method": "initialized", "params": {}})
              send({"id": 2, "method": "account/read", "params": {"refreshToken": False}})
              account_result = receive(2)
              if "account" not in account_result:
                  raise RuntimeError("Codex App Server account/read response has no account field")
              send({"id": 3, "method": "account/login/start", "params": {"type": "chatgpt"}})
              login_result = receive(3)
              auth_url = login_result.get("authUrl", "")
              auth_host = urlparse(auth_url).hostname or ""
              trusted_host = (
                  auth_host == "chatgpt.com"
                  or auth_host.endswith(".chatgpt.com")
                  or auth_host == "openai.com"
                  or auth_host.endswith(".openai.com")
              )
              if not auth_url.startswith("https://") or not trusted_host or not login_result.get("loginId"):
                  raise RuntimeError("Codex App Server account/login/start did not return a valid ChatGPT authorization URL")
              print("Codex App Server initialize, account/read, and account/login/start smoke tests passed")
          finally:
              if process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
          PY

          echo "APP_SERVER_BINARY=$APP_SERVER_BINARY" >> "$GITHUB_ENV"
          echo "CODEX_LICENSE=$CODEX_LICENSE" >> "$GITHUB_ENV"

      - name: Assemble and sign app bundle
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MauQuota.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" "$APP/Contents/Helpers"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          cp .build/release/MauQuota "$APP/Contents/MacOS/MauQuota"
          cp "$APP_SERVER_BINARY" "$APP/Contents/Helpers/codex-app-server"
          cp "$CODEX_LICENSE" "$APP/Contents/Resources/Codex-LICENSE.txt"
          chmod 755 "$APP/Contents/MacOS/MauQuota" "$APP/Contents/Helpers/codex-app-server"
          codesign --force --sign - --timestamp=none "$APP/Contents/Helpers/codex-app-server"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify binary architecture
        run: |
          set -euo pipefail
          HOST_ARCH="$(uname -m)"
          for BINARY in "$RUNNER_TEMP/MauQuota.app/Contents/MacOS/MauQuota" "$RUNNER_TEMP/MauQuota.app/Contents/Helpers/codex-app-server"; do
            BINARY_ARCHS="$(lipo -archs "$BINARY")"
            case " $BINARY_ARCHS " in
              *" $HOST_ARCH "*) ;;
              *) echo "Architecture mismatch: host=$HOST_ARCH binary=$BINARY_ARCHS path=$BINARY" >&2; exit 1 ;;
            esac
          done

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ARCH="$(uname -m)"
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING" dist
          ditto "$RUNNER_TEMP/MauQuota.app" "$STAGING/MauQuota.app"
          ln -s /Applications "$STAGING/Applications"
          DMG="dist/MauQuota-${VERSION}-macos-${ARCH}.dmg"
          hdiutil create -quiet -volname "MauQuota ${VERSION}" \
            -srcfolder "$STAGING" -format UDZO -imagekey zlib-level=9 -ov "$DMG"
          hdiutil verify "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: MauQuota-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/heads/preview/') || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview.'))
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches Info.plist
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v$VERSION"
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match Info.plist version $VERSION" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download DMGs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && shasum -a 256 *.dmg > SHA256SUMS)
          if [[ "$GITHUB_REF" == refs/heads/preview/* ]]; then
            gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS \
              --target "$GITHUB_SHA" --title "MauQuota $RELEASE_TAG (Preview)" \
              --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS \
              --title "MauQuota $RELEASE_TAG" --generate-notes
          fi
