name: Build & Release

on:
  push:
    branches: [main, feature/menu-bar-ring-only]
    tags: ["v*", "!*-preview.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run tests
        run: swift test

  build:
    name: Build (${{ matrix.arch }})
    # Cross-compile arm64 on Intel macOS runner; validate the binary architecture.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build release binary
        run: swift build --configuration release --arch ${{ matrix.arch }} --product MauQuota

      - name: Assemble and sign app bundle
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MauQuota.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          cp Resources/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          BIN_DIR="$(swift build --configuration release --arch ${{ matrix.arch }} --show-bin-path)"
          cp "$BIN_DIR/MauQuota" "$APP/Contents/MacOS/MauQuota"
          chmod 755 "$APP/Contents/MacOS/MauQuota"
          codesign --force --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify binary architecture
        run: |
          set -euo pipefail
          EXPECTED_ARCH="${{ matrix.arch }}"
          BINARY="$RUNNER_TEMP/MauQuota.app/Contents/MacOS/MauQuota"
          BINARY_ARCHS="$(lipo -archs "$BINARY")"
          case " $BINARY_ARCHS " in
            *" $EXPECTED_ARCH "*) ;;
            *) echo "Architecture mismatch: expected=$EXPECTED_ARCH binary=$BINARY_ARCHS path=$BINARY" >&2; exit 1 ;;
          esac

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          ARCH="${{ matrix.arch }}"
          STAGING="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGING" dist
          ditto "$RUNNER_TEMP/MauQuota.app" "$STAGING/MauQuota.app"
          ln -s /Applications "$STAGING/Applications"
          DIST_VERSION="$VERSION"
          if [[ "$GITHUB_REF" == "refs/heads/feature/menu-bar-ring-only" ]]; then
            DIST_VERSION="$VERSION-preview.1"
          fi
          DMG="dist/MauQuota-${DIST_VERSION}-macos-${ARCH}.dmg"
          hdiutil create -quiet -volname "MauQuota ${VERSION}" \
            -srcfolder "$STAGING" -format UDZO -imagekey zlib-level=9 -ov "$DMG"
          hdiutil verify "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: MauQuota-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-preview.')) || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish MauQuota 2.0.1')) || (github.ref == 'refs/heads/feature/menu-bar-ring-only' && contains(github.event.head_commit.message, '[publish-preview]'))
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine release tag and verify version
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$GITHUB_REF" == "refs/heads/feature/menu-bar-ring-only" ]]; then
            RELEASE_TAG="v$VERSION-preview.1"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v$VERSION"
          fi
          TAG_VERSION="${RELEASE_TAG#v}"
          TAG_VERSION="${TAG_VERSION%%-preview.*}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match Info.plist version $VERSION" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download DMGs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify both release installers
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          DIST_VERSION="$VERSION"
          if [[ "$GITHUB_REF" == "refs/heads/feature/menu-bar-ring-only" ]]; then
            DIST_VERSION="$VERSION-preview.1"
          fi
          test -s "artifacts/MauQuota-${DIST_VERSION}-macos-arm64.dmg"
          test -s "artifacts/MauQuota-${DIST_VERSION}-macos-x86_64.dmg"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd artifacts && shasum -a 256 *.dmg > SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skip duplicate creation."
          else
            NOTES_FILE=".github/release-notes/${RELEASE_TAG}.md"
            RELEASE_FLAGS=()
            if [[ "$RELEASE_TAG" == *-preview.* ]]; then
              RELEASE_FLAGS+=(--prerelease)
            fi
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS \
                --target "$GITHUB_SHA" --title "MauQuota $RELEASE_TAG" "${RELEASE_FLAGS[@]}" --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" artifacts/*.dmg artifacts/SHA256SUMS \
                --target "$GITHUB_SHA" --title "MauQuota $RELEASE_TAG" "${RELEASE_FLAGS[@]}" --generate-notes
            fi
          fi

      - name: Verify stable Release and its installers before cleanup
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish MauQuota 2.0.1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "$(gh release view "v$VERSION" --json isPrerelease --jq '.isPrerelease')" = "false"
          for file in "MauQuota-${VERSION}-macos-arm64.dmg" "MauQuota-${VERSION}-macos-x86_64.dmg" "SHA256SUMS"; do
            gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -Fxq "$file"
          done

      - name: Delete superseded preview Release, tags and branch
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Publish MauQuota 2.0.1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREVIEW_TAGS="$(gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true and (.tagName | contains("-preview."))) | .tagName')"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "Deleting preview release and tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done <<< "$PREVIEW_TAGS"

          # Remove orphan preview tags even if their Release was previously deleted.
          ORPHAN_REFS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref | select(contains("-preview."))')"
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            echo "Deleting preview tag: $ref"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/$ref"
          done <<< "$ORPHAN_REFS"

          echo "Deleting merged preview/memory-stability-v2.0.1 branch"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/preview/memory-stability-v2.0.1"
          echo "Stable Release and preview cleanup completed."
